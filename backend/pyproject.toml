[project]
name = "market-ai-backend"
version = "0.1.0"
description = "AI-powered market analysis backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "openai>=1.40",
    "stripe>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]
